name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck skills/orch8/orch8.sh tests/run.sh tests/stubs/git tests/stubs/herdr

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: fan-out tests (stub herdr + stub git, never a real repo or a real Herdr)
        run: bash tests/run.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: manifests are valid JSON and the skill frontmatter is complete
        run: |
          python3 -c "import json,sys;[json.load(open(f)) for f in sys.argv[1:]]" \
            .claude-plugin/plugin.json .claude-plugin/marketplace.json
          python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("skills/orch8/SKILL.md").read_text()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m: sys.exit("SKILL.md has no YAML frontmatter")
          fm = m.group(1)
          for key in ("name", "description"):
              if not re.search(rf"^{key}:\s*\S", fm, re.M):
                  sys.exit(f"SKILL.md frontmatter is missing {key}")
          desc = re.search(r"^description:\s*(.+)$", fm, re.M).group(1)
          if "Use when" not in desc:
              sys.exit("description must be a when-to-use pointer (needs 'Use when')")
          name = re.search(r"^name:\s*(\S+)", fm, re.M).group(1)
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", name):
              sys.exit(f"skill name must be lowercase ASCII kebab-case, got {name!r}")
          print("frontmatter ok")
          PY
      - name: orch8.sh stays executable
        run: test -x skills/orch8/orch8.sh || { echo "orch8.sh is not executable"; exit 1; }
